name: Create Release

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

jobs:
  create-release:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/v')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v6

      - name: Extract version from branch name
        id: version
        run: |
          BRANCH="${{ github.event.pull_request.head.ref }}"
          VERSION="${BRANCH#release/}"
          echo "tag=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --generate-notes

  # Opens a version-bump PR against zed-industries/extensions so the Zed
  # extension registry picks up the new release. This must live in this
  # workflow (rather than a tag- or release-triggered one) because the tag
  # is created with the default GITHUB_TOKEN, which never triggers other
  # workflows.
  # The registry lists the extension as [pgfmt-lsp] in extensions.toml,
  # with a submodule pointing at this repo (path = "zed-pgfmt"). Releasing
  # means bumping that version and advancing the submodule gitlink to the
  # tagged commit — no clone of this repo or the submodule is needed.
  # Setup: fork zed-industries/extensions to middle-management/extensions,
  # create a classic PAT with the "repo" scope on an account with push
  # access to that fork, and add it as a repo secret named
  # ZED_COMMITTER_TOKEN.
  bump-zed-extension:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - name: Open version-bump PR against zed-industries/extensions
        env:
          GH_TOKEN: ${{ secrets.ZED_COMMITTER_TOKEN }}
          TAG: ${{ needs.create-release.outputs.tag }}
          FORK: middle-management/extensions
          UPSTREAM: zed-industries/extensions
        run: |
          VERSION="${TAG#v}"
          BRANCH="pgfmt-lsp-v${VERSION}"

          # Resolve the tag to its commit, peeling if annotated
          SHA=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" --jq '.object.sha')
          TYPE=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" --jq '.object.type')
          if [ "${TYPE}" = "tag" ]; then
            SHA=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${SHA}" --jq '.object.sha')
          fi

          gh repo sync "${FORK}" --source "${UPSTREAM}" --branch main

          gh auth setup-git
          git clone --depth 1 "https://github.com/${FORK}.git" extensions-fork
          cd extensions-fork
          git checkout -b "${BRANCH}"

          # Bump the version line within the [pgfmt-lsp] section only
          sed -i "/^\[pgfmt-lsp\]$/,/^\[/ s/^version = \".*\"/version = \"${VERSION}\"/" extensions.toml
          grep -A4 '^\[pgfmt-lsp\]$' extensions.toml | grep -q "version = \"${VERSION}\"" || {
            echo "::error::Failed to bump pgfmt-lsp version in extensions.toml"
            exit 1
          }

          # Point the submodule gitlink (mode 160000) at the tagged commit;
          # the submodule itself never needs to be initialized for this
          git update-index --add --cacheinfo "160000,${SHA},extensions/pgfmt-lsp"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add extensions.toml
          git commit -m "Update pgfmt-lsp to v${VERSION}"
          git push --force -u origin "${BRANCH}"

          gh pr create \
            --repo "${UPSTREAM}" \
            --head "middle-management:${BRANCH}" \
            --title "Update pgfmt-lsp to v${VERSION}" \
            --body "Bumps pgfmt-lsp to v${VERSION}. Release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runner: ubuntu-latest
          - goos: linux
            goarch: arm64
            runner: ubuntu-latest
            cc: aarch64-linux-gnu-gcc
            cross_pkg: gcc-aarch64-linux-gnu
          - goos: darwin
            goarch: amd64
            runner: macos-latest
          - goos: darwin
            goarch: arm64
            runner: macos-latest

    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"

      - name: Install cross-compiler
        if: matrix.cross_pkg != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.cross_pkg }}

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "1"
          CC: ${{ matrix.cc }}
        run: |
          VERSION="${{ needs.create-release.outputs.tag }}"
          go build -ldflags "-X main.version=${VERSION}" -o "pgfmt-${{ matrix.goos }}-${{ matrix.goarch }}" .
          go build -ldflags "-X main.version=${VERSION}" -o "pgfmt-lsp-${{ matrix.goos }}-${{ matrix.goarch }}" ./cmd/pgfmt-lsp

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.create-release.outputs.tag }}" \
            "pgfmt-${{ matrix.goos }}-${{ matrix.goarch }}" \
            "pgfmt-lsp-${{ matrix.goos }}-${{ matrix.goarch }}"
