name: Create Release

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

jobs:
  create-release:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/v')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v6

      - name: Extract version from branch name
        id: version
        run: |
          BRANCH="${{ github.event.pull_request.head.ref }}"
          VERSION="${BRANCH#release/}"
          echo "tag=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --generate-notes

  # Opens a version-bump PR against zed-industries/extensions so the Zed
  # extension registry picks up the new release. This must live in this
  # workflow (rather than a tag- or release-triggered one) because the tag
  # is created with the default GITHUB_TOKEN, which never triggers other
  # workflows.
  # Setup: fork zed-industries/extensions to middle-management/extensions,
  # create a classic PAT with "repo" and "workflow" scopes on an account
  # with push access to that fork, and add it as a repo secret named
  # ZED_COMMITTER_TOKEN.
  bump-zed-extension:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - name: Bump extension in Zed registry
        uses: huacnlee/zed-extension-action@v1
        with:
          extension-name: pgfmt-lsp
          push-to: middle-management/extensions
          tag-name: ${{ needs.create-release.outputs.tag }}
        env:
          COMMITTER_TOKEN: ${{ secrets.ZED_COMMITTER_TOKEN }}

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runner: ubuntu-latest
          - goos: linux
            goarch: arm64
            runner: ubuntu-latest
            cc: aarch64-linux-gnu-gcc
            cross_pkg: gcc-aarch64-linux-gnu
          - goos: darwin
            goarch: amd64
            runner: macos-latest
          - goos: darwin
            goarch: arm64
            runner: macos-latest

    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"

      - name: Install cross-compiler
        if: matrix.cross_pkg != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.cross_pkg }}

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "1"
          CC: ${{ matrix.cc }}
        run: |
          VERSION="${{ needs.create-release.outputs.tag }}"
          go build -ldflags "-X main.version=${VERSION}" -o "pgfmt-${{ matrix.goos }}-${{ matrix.goarch }}" .
          go build -ldflags "-X main.version=${VERSION}" -o "pgfmt-lsp-${{ matrix.goos }}-${{ matrix.goarch }}" ./cmd/pgfmt-lsp

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.create-release.outputs.tag }}" \
            "pgfmt-${{ matrix.goos }}-${{ matrix.goarch }}" \
            "pgfmt-lsp-${{ matrix.goos }}-${{ matrix.goarch }}"
