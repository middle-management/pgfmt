name: Release

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          ext=""
          if [ "${{ matrix.goos }}" = "windows" ]; then
            ext=".exe"
          fi
          go build -o "pgfmt-${{ matrix.goos }}-${{ matrix.goarch }}${ext}" .
          go build -o "pgfmt-lsp-${{ matrix.goos }}-${{ matrix.goarch }}${ext}" ./cmd/pgfmt-lsp

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ext=""
          if [ "${{ matrix.goos }}" = "windows" ]; then
            ext=".exe"
          fi
          gh release upload "${{ github.event.release.tag_name }}" \
            "pgfmt-${{ matrix.goos }}-${{ matrix.goarch }}${ext}" \
            "pgfmt-lsp-${{ matrix.goos }}-${{ matrix.goarch }}${ext}"
