name: Release

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ steps.bump.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump extension version
        id: bump
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"
          sed -i "s/^version = \"[^\"]*\"/version = \"${VERSION}\"/" zed-pgfmt/extension.toml
          sed -i "s/^const VERSION: &str = \"[^\"]*\";/const VERSION: \&str = \"${VERSION}\";/" zed-pgfmt/src/lib.rs
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add zed-pgfmt/extension.toml zed-pgfmt/src/lib.rs
          git commit -m "chore: bump extension version to ${VERSION}"
          git push origin HEAD:main
          echo "commit_sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runner: ubuntu-latest
          - goos: linux
            goarch: arm64
            runner: ubuntu-latest
            cc: aarch64-linux-gnu-gcc
            cross_pkg: gcc-aarch64-linux-gnu
          - goos: darwin
            goarch: amd64
            runner: macos-latest
          - goos: darwin
            goarch: arm64
            runner: macos-latest

    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.version.outputs.commit_sha }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"

      - name: Install cross-compiler
        if: matrix.cross_pkg != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.cross_pkg }}

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "1"
          CC: ${{ matrix.cc }}
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          go build -ldflags "-X main.version=${VERSION}" -o "pgfmt-${{ matrix.goos }}-${{ matrix.goarch }}" .
          go build -ldflags "-X main.version=${VERSION}" -o "pgfmt-lsp-${{ matrix.goos }}-${{ matrix.goarch }}" ./cmd/pgfmt-lsp

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            "pgfmt-${{ matrix.goos }}-${{ matrix.goarch }}" \
            "pgfmt-lsp-${{ matrix.goos }}-${{ matrix.goarch }}"
