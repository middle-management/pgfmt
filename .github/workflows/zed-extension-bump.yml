name: Bump Zed Extension

# Opens (or refreshes) a version-bump PR against zed-industries/extensions
# so the Zed extension registry picks up a pgfmt release.
#
# The registry lists the extension as [pgfmt-lsp] in extensions.toml, with a
# submodule pointing at this repo (path = "zed-pgfmt"). Releasing means
# bumping that version and advancing the submodule gitlink to the tagged
# commit — no clone of this repo or the submodule is needed.
#
# Setup: fork zed-industries/extensions to middle-management/extensions,
# create a classic PAT with the "repo" scope on an account with push access
# to that fork AND a signed Zed CLA (https://zed.dev/cla), and add it as a
# repo secret named ZED_COMMITTER_TOKEN. The commit is authored as the PAT
# owner: Zed's CLA bot rejects commits authored by github-actions[bot],
# which cannot sign the CLA.
#
# Runs automatically from the release workflow; can also be dispatched
# manually to retry a bump for an existing tag (the branch is force-pushed,
# so an open registry PR updates in place).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.4.0)"
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
    secrets:
      ZED_COMMITTER_TOKEN:
        required: true

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Open version-bump PR against zed-industries/extensions
        env:
          GH_TOKEN: ${{ secrets.ZED_COMMITTER_TOKEN }}
          TAG: ${{ inputs.tag }}
          FORK: middle-management/extensions
          UPSTREAM: zed-industries/extensions
        run: |
          VERSION="${TAG#v}"
          BRANCH="pgfmt-lsp-v${VERSION}"

          # Resolve the tag to its commit, peeling if annotated
          SHA=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" --jq '.object.sha')
          TYPE=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" --jq '.object.type')
          if [ "${TYPE}" = "tag" ]; then
            SHA=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${SHA}" --jq '.object.sha')
          fi

          gh repo sync "${FORK}" --source "${UPSTREAM}" --branch main

          gh auth setup-git
          git clone --depth 1 "https://github.com/${FORK}.git" extensions-fork
          cd extensions-fork
          git checkout -b "${BRANCH}"

          # Bump the version line within the [pgfmt-lsp] section only
          sed -i "/^\[pgfmt-lsp\]$/,/^\[/ s/^version = \".*\"/version = \"${VERSION}\"/" extensions.toml
          grep -A4 '^\[pgfmt-lsp\]$' extensions.toml | grep -q "version = \"${VERSION}\"" || {
            echo "::error::Failed to bump pgfmt-lsp version in extensions.toml"
            exit 1
          }

          # Point the submodule gitlink (mode 160000) at the tagged commit;
          # the submodule itself never needs to be initialized for this
          git update-index --add --cacheinfo "160000,${SHA},extensions/pgfmt-lsp"

          # Author as the PAT owner: Zed's CLA bot checks commit authors,
          # and github-actions[bot] cannot sign the CLA.
          LOGIN=$(gh api user --jq '.login')
          USER_ID=$(gh api user --jq '.id')
          git config user.name "${LOGIN}"
          git config user.email "${USER_ID}+${LOGIN}@users.noreply.github.com"
          git add extensions.toml
          git commit -m "Update pgfmt-lsp to v${VERSION}"
          git push --force -u origin "${BRANCH}"

          # Create the PR unless one is already open for this branch. The
          # REST pulls list is authoritative; `gh pr list --head` relies on
          # the search index and can miss just-pushed branches, making a
          # retry fail on "pull request already exists".
          OPEN=$(gh api "repos/${UPSTREAM}/pulls?head=middle-management:${BRANCH}&state=open" --jq 'length')
          if [ "${OPEN}" = "0" ]; then
            gh pr create \
              --repo "${UPSTREAM}" \
              --head "middle-management:${BRANCH}" \
              --title "Update pgfmt-lsp to v${VERSION}" \
              --body "Bumps pgfmt-lsp to v${VERSION}. Release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
          else
            echo "Registry PR already open for ${BRANCH}; branch was force-pushed, PR refreshed in place."
          fi
