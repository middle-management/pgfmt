name: Deploy Playground

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: true

      - name: Configure Pages
        if: github.event_name == 'push'
        uses: actions/configure-pages@v5

      - uses: actions/setup-go@v6

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14

      - name: Build pg-query-emscripten
        working-directory: third_party/pg-query-emscripten
        run: make

      - name: Copy pg_query.js to playground
        run: cp third_party/pg-query-emscripten/pg_query_wasm.js playground/pg_query.js

      - name: Build WASM
        run: GOOS=wasip1 GOARCH=wasm go build -o playground/pgfmt-print.wasm ./cmd/pgfmt-print

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        working-directory: playground
        run: npm ci && npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: playground
        run: npx playwright test

      - name: Upload Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v4
        with:
          path: playground

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
