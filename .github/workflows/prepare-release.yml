name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.2.0)"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Validate version format
        run: |
          if ! echo "${{ inputs.version }}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Version must be in semver format (e.g. 0.2.0)"
            exit 1
          fi

      - name: Update version strings
        env:
          VERSION: ${{ inputs.version }}
        run: |
          # lsp/server.go — hardcoded ServerInfo version
          sed -i "s/ServerInfo{Name: \"pgfmt-lsp\", Version: \"[^\"]*\"}/ServerInfo{Name: \"pgfmt-lsp\", Version: \"${VERSION}\"}/" lsp/server.go

          # zed-pgfmt/extension.toml — extension version
          sed -i "s/^version = \"[^\"]*\"/version = \"${VERSION}\"/" zed-pgfmt/extension.toml

          # zed-pgfmt/Cargo.toml — package version
          sed -i '0,/^version = "[^"]*"/{s/^version = "[^"]*"/version = "'"${VERSION}"'"/}' zed-pgfmt/Cargo.toml

          # zed-pgfmt/src/lib.rs — VERSION constant
          sed -i "s/const VERSION: &str = \"[^\"]*\";/const VERSION: \&str = \"${VERSION}\";/" zed-pgfmt/src/lib.rs

      - name: Verify changes
        env:
          VERSION: ${{ inputs.version }}
        run: |
          echo "Checking version was updated in all files..."
          grep -q "Version: \"${VERSION}\"" lsp/server.go
          grep -q "version = \"${VERSION}\"" zed-pgfmt/extension.toml
          grep -q "version = \"${VERSION}\"" zed-pgfmt/Cargo.toml
          grep -q "const VERSION: &str = \"${VERSION}\";" zed-pgfmt/src/lib.rs
          echo "All version strings updated to ${VERSION}"

      # Uses PAT via RELEASE_TOKEN so the created PR triggers CI.
      # PRs created by the default GITHUB_TOKEN don't trigger workflows.
      # Setup: create a fine-grained PAT with Contents + Pull Requests
      # write access, then add it as a repo secret named RELEASE_TOKEN.
      - name: Create pull request
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          BRANCH="release/v${{ inputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "${BRANCH}"
          git add -A
          git commit -m "release: v${{ inputs.version }}"
          git push -u origin "${BRANCH}"
          gh pr create \
            --title "release: v${{ inputs.version }}" \
            --label "release" \
            --body "$(cat <<EOF
          ## Release v${{ inputs.version }}

          This PR bumps version strings for the v${{ inputs.version }} release.

          ### Updated files
          - \`lsp/server.go\` — LSP server info version
          - \`zed-pgfmt/extension.toml\` — Zed extension version
          - \`zed-pgfmt/Cargo.toml\` — Cargo package version
          - \`zed-pgfmt/src/lib.rs\` — VERSION constant

          ### What happens on merge
          A GitHub release \`v${{ inputs.version }}\` will be created automatically, which triggers the release build workflow to compile and upload binaries. A version-bump PR is also opened against \`zed-industries/extensions\` to publish the new Zed extension version.
          EOF
          )"
